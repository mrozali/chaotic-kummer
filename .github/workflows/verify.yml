name: verify

# Runs ./verify.sh quick on every push: the figures and every quoted number from the stored spectra,
# the rebuild of the first-order spectra at E = 3, 4, 5 and of the hidden Z_2 at E = 2 and 4 from the
# free-field code, and the chiral GOE reference.  The same command runs locally, see
# environment/README.md.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # pdftoppm renders the figures for their pixel comparison with the Letter's figures.
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install the pinned packages
        run: |
          python -m venv .venv
          .venv/bin/pip install -r environment/requirements.txt

      - name: Verify
        run: ./verify.sh quick

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-logs
          path: code/figure-reproduction/generated/verify_logs/
